services:
  frontend:
    build:
      context: ./website_FE
      dockerfile: Dockerfile
    container_name: creativekg-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:80"
    volumes:
      # Persistent cache volume for Nginx proxy caching & Google Drive images
      - media_cache:/var/cache/nginx/creativekg_media
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  media_cache:
    name: creativekg_media_cache
