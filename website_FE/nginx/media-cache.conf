# ==============================================================================
# Creative KG - High-Performance Nginx Media Caching & Instant Invalidation
# ==============================================================================
# This configuration implements a multi-tier proxy cache for media assets,
# Google Drive asset proxies, and optimized static uploads with instant bypass.
#
# Key Features:
# 1. 30-Day persistent disk caching for unchanged media assets.
# 2. Dynamic cache keys incorporating query string ($is_args$args).
#    When an image changes, the client appends ?v=<timestamp>, which generates
#    a distinct cache key and instantly serves the fresh image with ZERO staleness!
# 3. Cache-bypass headers (Cache-Control: no-cache, Pragma: no-cache, or ?nocache=1).
# 4. Microcaching for high-concurrency requests and thundering-herd protection.
# ==============================================================================

# Define persistent proxy cache zone (100MB shared memory, 20GB max disk storage)
proxy_cache_path /var/cache/nginx/creativekg_media 
    levels=1:2 
    keys_zone=CREATIVEKG_MEDIA_CACHE:100m 
    max_size=20g 
    inactive=60d 
    use_temp_path=off;

server {
    listen 80 default_server;
    server_name _ localhost creativekg.com www.creativekg.com;

    # Gzip compression for text, HTML, CSS, JS, SVG, JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 0. Vite Bundled JS/CSS Assets (Hashed & Immutable)
    # --------------------------------------------------------------------------
    location /assets/ {
        root /var/www/creativekg/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 1. Static Uploads & Media Storage Cache
    # --------------------------------------------------------------------------
    location ~* ^/uploads/.*\.(jpg|jpeg|png|webp|avif|gif|svg|ico)$ {
        root /var/www/creativekg/dist;
        
        # Cache key binds scheme, host, path, and version query parameters
        # e.g., /uploads/wedding-hero.jpg?v=1725492000
        set $cache_key "$scheme$request_method$host$uri$is_args$args";

        # Instant Cache Bypass Check
        # If client passes ?nocache=1 or Cache-Control: no-cache, bypass cache directly
        set $bypass_cache 0;
        if ($arg_nocache = "1") {
            set $bypass_cache 1;
        }
        if ($http_cache_control ~* "no-cache|no-store") {
            set $bypass_cache 1;
        }

        # Client-side cache headers
        # When version query (?v=...) is present, it's immutable; otherwise revalidate
        if ($arg_v) {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        if ($arg_v = "") {
            add_header Cache-Control "public, max-age=86400, must-revalidate";
        }

        add_header X-Cache-Status $upstream_cache_status;
        add_header Access-Control-Allow-Origin "*";
        expires 30d;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # 2. Google Drive Cloud Storage Asset Proxy & Micro-cache
    # --------------------------------------------------------------------------
    location /drive-media/ {
        # Proxies stream from Google Drive or backend media storage API
        proxy_pass https://drive.google.com/;

        proxy_cache CREATIVEKG_MEDIA_CACHE;
        proxy_cache_key "$scheme$request_method$host$uri$is_args$args";
        proxy_cache_bypass $bypass_cache;
        proxy_no_cache $bypass_cache;

        # Cache successful media for 30 days
        proxy_cache_valid 200 302 30d;
        proxy_cache_valid 404 1m;

        # Serve stale copy if upstream Google Drive is temporarily unreachable
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Add debug headers to verify cache status in browser DevTools
        add_header X-Cache-Status $upstream_cache_status;
        add_header X-Media-Vault "Creative-KG-Master-Vault";
        add_header Access-Control-Allow-Origin "*";

        # Security & streaming
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
        proxy_buffering on;
        proxy_buffers 16 64k;
    }

    # --------------------------------------------------------------------------
    # 3. Main Single Page App (Frontend)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/creativekg/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # HTML is never cached aggressively so live edits load instantly
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # 4. Block Google AI Studio / Internal Project Descriptor Files
    # --------------------------------------------------------------------------
    # These files must NEVER be publicly accessible — they trigger social scrapers
    # (WhatsApp, Telegram, Facebook) to display "My Google AI Studio App" branding.
    location = /metadata.json {
        return 404;
    }
    location = /.gemini {
        return 404;
    }

    # --------------------------------------------------------------------------
    # 5. Security & Anti-Clickjacking Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
